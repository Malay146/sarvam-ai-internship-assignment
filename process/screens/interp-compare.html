<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../design-system/tokens.css">
<style>body{margin:0;padding:32px;background:#fcfcfc;font:14px system-ui;color:#1f1f1f}
.row{display:grid;grid-template-columns:120px repeat(4,1fr);gap:16px;margin-bottom:16px;align-items:center}
.row div{height:220px;border-radius:16px}.h{font-weight:600}</style></head><body>
<div class="row h"><span></span><span>Dusk</span><span>Dawn</span><span>Indigo glow</span><span>Sun</span></div>
<div id="r"></div>
<script>
const cs=getComputedStyle(document.documentElement);
const g=n=>cs.getPropertyValue('--gradient-'+n).trim();
for(const sp of ["srgb (current)","oklab","oklch"]){
  const row=document.createElement('div');row.className='row';row.innerHTML=`<span>${sp}</span>`;
  for(const n of ["dusk","dawn","indigo-glow","sun"]){
    let v=g(n); const key=sp.split(' ')[0];
    if(key!=="srgb") v=v.replace(/^(linear-gradient\()180deg/,`$1in ${key} 180deg`).replace(/^(radial-gradient\()circle/,`$1in ${key} circle`);
    const d=document.createElement('div'); d.style.background=v; if(n==="sun"){d.style.backgroundSize="100% 100%";d.style.border="1px solid #f0f0f0"}
    row.appendChild(d);
  }
  document.getElementById('r').appendChild(row);
}
</script></body></html>
